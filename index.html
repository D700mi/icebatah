<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج إدارة المحل</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2b36;--mu:#6b7a86;--pr:#0f766e;--prt:#fff;--bd:#dde3e8;--rd:#c0392b;--gn:#15803d;--am:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171c;--card:#1a242b;--tx:#e8eef2;--mu:#93a3ae;--pr:#2dd4bf;--prt:#07211e;--bd:#2c3a43;--rd:#f87171;--gn:#4ade80;--am:#fbbf24}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{white-space:nowrap;background:none;border:0;padding:12px 14px;border-radius:10px;font-size:15px;color:var(--tx);cursor:pointer}
nav button.on{background:var(--pr);color:var(--prt);font-weight:bold}
main{max-width:1100px;margin:auto;padding:14px}
h2{margin:6px 0 12px}h3{margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.k small{color:var(--mu);display:block;margin-bottom:4px}.k b{font-size:19px}
.g{color:var(--gn)}.r{color:var(--rd)}.m{color:var(--mu)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--bg);color:var(--tx);font-family:inherit}
label{display:block;font-size:14px;color:var(--mu);margin-bottom:4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.b{background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:13px 18px;font-size:16px;cursor:pointer;font-family:inherit}
.b.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:8px 12px;font-size:14px}.b.d{background:var(--rd);color:#fff}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mu);font-weight:normal}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{padding:9px 16px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-family:inherit}.tabs button.on{background:var(--pr);color:var(--prt)}
.pos{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}@media(max-width:800px){.pos{grid-template-columns:1fr}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px;max-height:60vh;overflow:auto}
.it{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;text-align:right;color:var(--tx);font-family:inherit}.it:hover{border-color:var(--pr)}
.it.x{opacity:.45}.hint{background:var(--bg);border-radius:10px;padding:10px;color:var(--mu);font-size:14px;margin:8px 0}
.row{display:flex;justify-content:space-between;padding:5px 0}.tot{font-size:20px;font-weight:bold;border-top:2px solid var(--bd);margin-top:6px;padding-top:8px}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md>div{background:var(--card);color:var(--tx);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
#tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:10px;z-index:30;display:none}
@media print{nav,#tt,.noprint{display:none!important}body:has(.md) main{display:none}.md{position:static;background:none;padding:0}.md>div{max-height:none;overflow:visible;max-width:none!important}body{background:#fff}.md>div,.md>div *{background:#fff!important;color:#000!important}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="tt"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KEY='shop_v1',PAGES=['الرئيسية','المخزون والمشتريات','المنتجات','تركيب المنتجات','المبيعات والكاشير','المحاسبة والأرباح','التقارير','سجل المبيعات','الإعدادات'];
const DEF={products:[],purchases:[],combos:[],sales:[],seq:1,id:1,set:{rent:30,card:2.5,dev:50,low:5}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
S=Object.assign(JSON.parse(JSON.stringify(DEF)),S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذر حفظ البيانات في هذا المتصفح')}};
const $=s=>document.querySelector(s),fm=n=>(+n||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})+' ر.س';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date()),nowS=()=>today()+' '+pad(new Date().getHours())+':'+pad(new Date().getMinutes());
const nid=()=>S.id++,prod=id=>S.products.find(p=>p.id==id),num=v=>parseFloat(v)||0;
function toast(m){const t=$('#tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
let pg=0,cart=[],sq='',per='day',rp={k:'month',a:today(),b:today()},ptab='stock';
function range(k,a,b){const n=new Date();let s=dstr(n);if(k=='week'){const d=new Date(n);d.setDate(d.getDate()-6);return[dstr(d),s]}
 if(k=='month')return[s.slice(0,8)+'01',s];if(k=='custom')return[a,b];return[s,s]}
function calc(a,b){const L=S.sales.filter(s=>s.status=='ok'&&s.date.slice(0,10)>=a&&s.date.slice(0,10)<=b);
 const sum=f=>L.reduce((x,s)=>x+f(s),0),tot=sum(s=>s.total),cost=sum(s=>s.cost),cs=sum(s=>s.method=='card'?s.total:0);
 const gross=tot-cost,rent=gross*S.set.rent/100,cf=cs*S.set.card/100;let dev=0,dd=0;
 for(let d=new Date(a+'T00:00:00');dstr(d)<=b;d.setDate(d.getDate()+1)){const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();dd=S.set.dev/dim;dev+=dd}
 return{L,tot,cost,gross,rent,cf,dev,dd,net:gross-rent-cf-dev,cash:tot-cs,cs,n:L.length}}
const stockVal=()=>S.products.reduce((x,p)=>x+p.qty*p.avg,0);
const bd=c=>`<table><tr><td>الأرباح الإجمالية (المبيعات − تكلفة المنتجات المباعة)</td><td>${fm(c.gross)}</td></tr><tr><td>− الإيجار (${S.set.rent}% من الأرباح الإجمالية)</td><td>${fm(c.rent)}</td></tr><tr><td>− رسوم البطاقة (${S.set.card}% من مبيعات البطاقة ${fm(c.cs)})</td><td>${fm(c.cf)}</td></tr><tr><td>− رسوم الجهاز (${fm(S.set.dev)} شهرياً، حصة اليوم ${fm(c.dd)})</td><td>${fm(c.dev)}</td></tr><tr><td><b>= صافي الربح بعد الخصومات</b></td><td><b class="${c.net<0?'r':'g'}">${fm(c.net)}</b></td></tr></table>`;
function ask(m,fn){const d=document.createElement('div');d.className='md';d.innerHTML=`<div><p>${m}</p><button class="b d" id="ay">نعم، متأكد</button> <button class="b s" onclick="this.closest('.md').remove()">إلغاء</button></div>`;document.body.appendChild(d);$('#ay').onclick=()=>{d.remove();fn()}}
function nav(){$('#nav').innerHTML=PAGES.map((p,i)=>`<button class="${i==pg?'on':''}" onclick="go(${i})">${p}</button>`).join('')}
function go(i){pg=i;nav();R[i]();scrollTo(0,0)}
const R=[home,inv,prods,combos,cash,acct,reps,log,sett];
const tabs=(arr,cur,fn)=>`<div class="tabs">${arr.map(([k,t])=>`<button class="${k==cur?'on':''}" onclick="${fn}('${k}')">${t}</button>`).join('')}</div>`;
const kp=(t,v,c='')=>`<div class="k"><small>${t}</small><b class="${c}">${v}</b></div>`;
function topL(L){const m={};L.forEach(s=>s.lines.forEach(l=>{const o=m[l.name]||(m[l.name]={name:l.name,q:0,pr:0});o.q+=l.q;o.pr+=(l.price-l.cost)*l.q}));return Object.values(m)}
function home(){const[a,b]=range(per),c=calc(a,b),td=calc(today(),today()),t=topL(c.L).sort((x,y)=>y.q-x.q).slice(0,5);
 $('#main').innerHTML=`<h2>لوحة التحكم</h2>${bkWarn()}<div class="card"><h3>صافي ربح اليوم بعد جميع الخصومات</h3><p style="font-size:28px;margin:4px 0" class="${td.net<0?'r':'g'}"><b>${fm(td.net)}</b></p>${bd(td)}</div>${tabs([['day','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر']],per,'setPer')}
 <div class="grid">${kp('إجمالي المبيعات',fm(c.tot))}${kp('تكلفة المنتجات المباعة',fm(c.cost))}${kp('الأرباح الإجمالية',fm(c.gross),'g')}
 ${kp('صافي الأرباح بعد الخصومات',fm(c.net),c.net<0?'r':'g')}${kp('المبيعات النقدية',fm(c.cash))}${kp('مبيعات البطاقات',fm(c.cs))}
 ${kp('قيمة المخزون الحالي',fm(stockVal()))}${kp('عدد عمليات البيع',c.n)}</div>
 <div class="card" style="margin-top:14px"><h3>المنتجات الأكثر مبيعاً</h3>${t.length?`<table>${t.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.q} قطعة</td></tr>`).join('')}</table>`:'<p class="m">لا توجد مبيعات في هذه الفترة.</p>'}</div>
 ${per!='day'?`<div class="card"><h3>تفصيل الخصومات للفترة المختارة</h3>${bd(c)}</div>`:''}<p class="hint">رسوم الجهاز (${fm(S.set.dev)} شهرياً) تُوزَّع على أيام الشهر، فكل يوم يتحمل حصته، ومجموعها في الشهر الكامل ${fm(S.set.dev)} بالضبط.</p>`}
const setPer=k=>{per=k;home()};
function inv(){const o=S.products.map(p=>`<option value="${esc(p.name)}">`).join('');
 $('#main').innerHTML=`<h2>المخزون والمشتريات</h2><div class="card"><h3>إضافة مشتريات</h3>
 <div class="f"><div><label>اسم المنتج</label><input id="n" list="pl" placeholder="مثال: بسكوت"><datalist id="pl">${o}</datalist></div>
 <div><label>سعر شراء الكمية كاملة (ريال)</label><input id="t" type="number" step="any" min="0" oninput="pv()"></div>
 <div><label>عدد القطع في الكمية</label><input id="u" type="number" min="1" oninput="pv()"></div>
 <div><label>سعر بيع القطعة (ريال)</label><input id="sp" type="number" step="any" min="0" oninput="pv()"></div>
 <button class="b" onclick="addPur()">حفظ الشراء</button></div><div class="hint" id="pvw">أدخل البيانات ليظهر حساب التكلفة والربح تلقائياً.</div>
 <p class="m">إذا اشتريت نفس المنتج مرة أخرى بسعر مختلف يحسب البرنامج متوسط التكلفة تلقائياً.</p></div>
 <div class="card"><h3>المخزون الحالي</h3>${ptable()}</div>
 <div class="card"><h3>سجل المشتريات</h3><div class="w"><table><tr><th>التاريخ</th><th>المنتج</th><th>العدد</th><th>السعر الكلي</th><th>تكلفة القطعة</th></tr>
 ${S.purchases.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(p.name)}</td><td>${p.units}</td><td>${fm(p.total)}</td><td>${fm(p.uc)}</td></tr>`).join('')||'<tr><td colspan=5 class="m">لا توجد مشتريات.</td></tr>'}</table></div></div>`}
function pv(){const t=num($('#t').value),u=num($('#u').value),s=num($('#sp').value);if(!t||!u)return;const c=t/u;
 $('#pvw').innerHTML=`تكلفة القطعة: <b>${fm(c)}</b>`+(s?` — الربح للقطعة: <b class="${s>=c?'g':'r'}">${fm(s-c)}</b> — إجمالي الربح المتوقع: <b>${fm((s-c)*u)}</b>`:'')}
function addPur(){const n=$('#n').value.trim(),t=num($('#t').value),u=Math.floor(num($('#u').value)),s=num($('#sp').value);
 if(!n||t<=0||u<1)return toast('أدخل اسم المنتج والسعر وعدد القطع');
 let p=S.products.find(x=>x.name==n);if(!p){p={id:nid(),name:n,qty:0,avg:0,price:0};S.products.push(p)}
 p.avg=(p.qty*p.avg+t)/(p.qty+u);p.qty+=u;if(s)p.price=s;
 S.purchases.push({id:nid(),date:nowS(),name:n,pid:p.id,total:t,units:u,uc:t/u});save();toast('تم حفظ الشراء');inv()}
function ptable(){return`<div class="w"><table><tr><th>المنتج</th><th>الكمية (علب)</th><th>تكلفة القطعة</th><th>سعر البيع</th><th>ربح القطعة</th><th>ربح الكمية</th><th>تكفي لـ</th><th></th></tr>
 ${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="${p.qty<=S.set.low?'r':''}">${fq(p.qty)}</td><td>${fm(p.avg)}</td><td>${fm(p.price)}</td><td>${p.price?fm(p.price-p.avg):'—'}</td><td>${p.price?fm((p.price-p.avg)*p.qty):'—'}</td><td>${enough(p)}</td><td><button class="b s" onclick="editP(${p.id})">تعديل</button></td></tr>`).join('')||'<tr><td colspan=7 class="m">لا توجد منتجات بعد. أضف مشترياتك أولاً.</td></tr>'}</table></div>`}
function editP(id){const p=prod(id),d=document.createElement('div');d.className='md';
 d.innerHTML=`<div><h3>تعديل المنتج</h3><label>اسم المنتج</label><input id="ep1" value="${esc(p.name)}"><label style="margin-top:8px">سعر البيع (ريال)</label><input id="ep2" type="number" step="any" min="0" value="${p.price}"><label style="margin-top:8px">الكمية في المخزون</label><input id="ep3" type="number" min="0" step="any" value="${fq(p.qty)}"><p class="m">تعديل الكمية يدوياً يُسجَّل في سجل المشتريات كتعديل جرد.</p><button class="b" id="eps">حفظ التعديلات</button> <button class="b s" onclick="this.closest('.md').remove()">إلغاء</button></div>`;
 document.body.appendChild(d);$('#eps').onclick=()=>{const n=$('#ep1').value.trim(),pr=num($('#ep2').value),q=Math.max(0,+num($('#ep3').value).toFixed(2));if(!n)return toast('اكتب اسم المنتج');
 if(q!=fq(p.qty)){S.purchases.push({id:nid(),date:nowS()+' (تعديل جرد)',name:n,pid:p.id,total:0,units:+(q-p.qty).toFixed(2),uc:p.avg});p.qty=q}
 p.name=n;p.price=pr;save();d.remove();toast('تم حفظ التعديلات');R[pg]()}}
function prods(){const c=calc('2020-01-01',today()),t=topL(c.L),by=f=>t.slice().sort(f).slice(0,10);
 const tb=(L,k)=>`<table>${L.map(x=>`<tr><td>${esc(x.name)}</td><td>${k=='q'?x.q+' قطعة':fm(x.pr)}</td></tr>`).join('')||'<tr><td class="m">لا توجد بيانات</td></tr>'}</table>`;
 $('#main').innerHTML=`<h2>المنتجات</h2><div class="card"><h3>الأكثر مبيعاً</h3>${tb(by((a,b)=>b.q-a.q),'q')}</div><div class="card"><h3>الأعلى ربحاً</h3>${tb(by((a,b)=>b.pr-a.pr),'p')}</div>
 <div class="card"><h3>الأقل مبيعاً</h3>${tb(t.slice().sort((a,b)=>a.q-b.q).slice(0,10),'q')}</div>
 <div class="card"><h3>أوشكت على النفاد (${S.set.low} أو أقل)</h3>${tb(S.products.filter(p=>p.qty<=S.set.low).map(p=>({name:p.name,q:fq(p.qty)})),'q')}</div>
 <div class="card"><h3>المخزون وتكلفته</h3><p>قيمة البضاعة المتبقية (رأس مال موجود في المحل): <b>${fm(stockVal())}</b></p>${ptable()}</div>`}
let cb={id:0,name:'',price:0,items:[]};
function combos(){const o=S.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${fm(p.avg)})</option>`).join('');
 const cost=cb.items.reduce((x,i)=>x+(prod(i.pid)?.avg||0)*cons(i),0),pr=num(cb.price),pf=pr-cost;
 $('#main').innerHTML=`<h2>تركيب المنتجات</h2><div class="card"><h3>${cb.id?'تعديل منتج مركب':'منتج مركب جديد'}</h3>
 <div class="f"><div><label>اسم المنتج المركب</label><input id="cn" value="${esc(cb.name)}" oninput="cb.name=this.value" placeholder="مثال: بسكوت بالشوكولاتة"></div>
 <div><label>سعر البيع (ريال)</label><input type="number" step="any" min="0" value="${cb.price||''}" oninput="cb.price=this.value;cbs()"></div></div>
 <h3>المكونات</h3><div class="f"><div><label>المنتج</label><select id="cp">${o}</select></div><div><label>عدد الوحدات المستخدمة (غالباً 1)</label><input id="cq" type="number" min="1" value="1"></div><div><label>العلبة الواحدة تكفي كم حبة؟ (1 إذا تُستخدم كاملة)</label><input id="cper" type="number" min="1" step="any" value="1"></div><button class="b" onclick="addC()">إضافة مكوّن</button></div><p class="m">مثال: بسكوت بالشوكولا ← بسكوت (1، تكفي 1) + شوكولا (1، تكفي 17). كوب بالشوكولا ← كوب (1، تكفي 1) + شوكولا (1، تكفي 11).</p>
 <table>${cb.items.map((i,x)=>`<tr><td>${esc(prod(i.pid)?.name||'')}</td><td>× ${i.q}${(i.per||1)!=1?' (العلبة تكفي '+i.per+')':''}</td><td>${fm((prod(i.pid)?.avg||0)*cons(i))}</td><td><button class="b s d" onclick="cb.items.splice(${x},1);combos()">حذف</button></td></tr>`).join('')}</table>
 <div class="hint" id="cs">${cbtxt(cost,pr,pf)}</div><button class="b" onclick="saveC()">حفظ المنتج المركب</button>
 ${cb.id?'<button class="b s" onclick="cb={id:0,name:\'\',price:0,items:[]};combos()">إلغاء</button>':''}
 <p class="m">عند بيعه تُخصم مكوناته الفعلية من المخزون تلقائياً.</p></div>
 <div class="card"><h3>المنتجات المركبة</h3><div class="w"><table><tr><th>الاسم</th><th>المكونات</th><th>التكلفة</th><th>السعر</th><th>الربح</th><th>الهامش</th><th></th></tr>
 ${S.combos.map(c=>{const k=ccost(c);return`<tr><td>${esc(c.name)}</td><td>${c.items.map(i=>esc(prod(i.pid)?.name||'؟')+'×'+i.q+((i.per||1)!=1?' (علبة تكفي '+i.per+')':'')).join('، ')}</td><td>${fm(k)}</td><td>${fm(c.price)}</td><td>${fm(c.price-k)}</td><td>${c.price?Math.round((c.price-k)/c.price*100):0}%</td><td><button class="b s" onclick="editC(${c.id})">تعديل</button> <button class="b s d" onclick="delC(${c.id})">حذف</button></td></tr>`}).join('')||'<tr><td colspan=7 class="m">لا توجد تركيبات.</td></tr>'}</table></div></div>`}
const cons=i=>i.q/(i.per||1),fq=n=>+(+n).toFixed(2);
